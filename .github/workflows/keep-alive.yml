name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API Health
        # Replace the URL below with your actual Render backend URL once deployed.
        run: curl -s https://backend-menuqr.onrender.com/api/health
