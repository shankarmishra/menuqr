    </g>

    <!-- Royal Awadh Court Header -->
    <text y="-25" font-family="'Cinzel', Georgia, serif" font-size="13" letter-spacing="6" fill="#FCEAB2" font-weight="700">
      नवाब-ए-अवध का शाही फ़रमान
    </text>
    <text y="-5" font-family="'Cinzel', Georgia, serif" font-size="11" letter-spacing="4" fill="#D4AF37">
      THE IMPERIAL COURT PROCLAMATION • 1924
    </text>
    <line x1="-180" y1="12" x2="180" y2="12" stroke="url(#goldH)" stroke-width="1.8" />
    
    <!-- Royal Couplet 1 in Devanagari Hindi -->
    <text y="55" font-family="'Rozha One', 'Cinzel', serif" font-size="24" fill="#FFFDF0" letter-spacing="1">
      "ज़ायका वो नहीं जो सिर्फ़ ज़ुबान को भाए,"
    </text>
    <text y="92" font-family="'Rozha One', 'Cinzel', serif" font-size="24" fill="#FFFDF0" letter-spacing="1">
      "लज़्ज़त वो है जो रूह को सदियों तक महकाए।"
    </text>

    <!-- Evocative English Royal Prose Quotation -->
    <text y="155" font-family="'Playfair Display', Georgia, serif" font-size="19" fill="#FCEAB2" font-style="italic" letter-spacing="0.5">
      "In the royal banquets of the Nawabs, dining was never
    </text>
    <text y="185" font-family="'Playfair Display', Georgia, serif" font-size="19" fill="#FCEAB2" font-style="italic" letter-spacing="0.5">
      mere sustenance; it was a sacred fine art where patience
    </text>
    <text y="215" font-family="'Playfair Display', Georgia, serif" font-size="19" fill="#FCEAB2" font-style="italic" letter-spacing="0.5">
      was the chief ingredient, and embers the master painter."
    </text>
    <text y="255" font-family="'Newsreader', Georgia, serif" font-size="15" fill="#D1DFD6" font-style="italic">
      "To feast at this dastarkhwan is to taste four centuries of Nawabi nostalgia."
    </text>

    <text y="305" font-family="'Cinzel', Georgia, serif" font-size="11" letter-spacing="3" fill="#D4AF37">
      — उस्ताद मीर बाक़िर अली • प्रधान खानसामा (Chief Royal Chef)
    </text>

    <!-- Verified Royal Seal Stamp -->
    <g transform="translate(0, 375)">
      <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#0D1813" stroke="url(#gold24k)" stroke-width="1.2" />
      <text y="6" font-family="'Cinzel', serif" font-size="10" letter-spacing="3" fill="#D4AF37" font-weight="700">
        VERIFIED ROYAL MASTERPIECE • 100% HERITAGE
      </text>
    </g>
  </g>

