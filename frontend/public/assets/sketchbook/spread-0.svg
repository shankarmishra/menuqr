    </g>
  

  <!-- Left Cover Central Gold Foil Emblem & Evocative Royal Quotations -->
  <g transform="translate(440, 480)" text-anchor="middle">
    <!-- Royal Two Fishes Insignia (Awadh Mahi Maratib Crest) -->
    <g filter="url(#goldDropShadow)">
      <circle cx="0" cy="-120" r="58" fill="url(#goldFoilRadial)" stroke="#FFF9DB" stroke-width="1.5" />
      <circle cx="0" cy="-120" r="50" fill="none" stroke="#4E3502" stroke-width="1" stroke-dasharray="2,2" />
      <path d="M -32 -120 Q -18 -144 0 -134 Q 18 -144 32 -120 Q 18 -96 0 -106 Q -18 -96 -32 -120 Z" fill="#4E3502" opacity="0.85" />
