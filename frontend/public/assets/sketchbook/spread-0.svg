<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1240" width="1760" height="1240">
  
    <defs>
      <!-- 24K Royal Gold Gradient with Multi-Stop Metallic Sheen -->
      <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFDF0" />
        <stop offset="12%" stop-color="#FCEAB2" />
        <stop offset="28%" stop-color="#E5C158" />
        <stop offset="48%" stop-color="#AA820A" />
        <stop offset="70%" stop-color="#D4AF37" />
        <stop offset="88%" stop-color="#F7E7B4" />
        <stop offset="100%" stop-color="#6B4F09" />
      </linearGradient>

      <!-- Horizontal Gold Shimmer Bar -->
      <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#8C6808" stop-opacity="0" />
        <stop offset="15%" stop-color="#D4AF37" />
        <stop offset="50%" stop-color="#FFFBEB" />
        <stop offset="85%" stop-color="#D4AF37" />
        <stop offset="100%" stop-color="#8C6808" stop-opacity="0" />
      </linearGradient>

      <!-- Royal Medallion Gold Radial -->
      <radialGradient id="goldFoilRadial" cx="45%" cy="38%" r="60%">
        <stop offset="0%" stop-color="#FFFDF5" />
        <stop offset="22%" stop-color="#FCEAB2" />
        <stop offset="50%" stop-color="#D4AF37" />
        <stop offset="78%" stop-color="#9C7714" />
        <stop offset="100%" stop-color="#4E3502" />
      </radialGradient>

      <!-- 3D Crimson Red Wax Seal -->
      <radialGradient id="waxGrad" cx="35%" cy="30%" r="68%">
        <stop offset="0%" stop-color="#EF4444" />
        <stop offset="30%" stop-color="#B91C1C" />
        <stop offset="65%" stop-color="#7F1D1D" />
        <stop offset="100%" stop-color="#450A0A" />
      </radialGradient>

      <!-- Copper Handi Gradient -->
      <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FED7AA" />
        <stop offset="30%" stop-color="#EA580C" />
        <stop offset="65%" stop-color="#C2410C" />
        <stop offset="100%" stop-color="#7C2D12" />
      </linearGradient>

      <!-- Emerald Morocco Leather Cover Gradient -->
      <radialGradient id="leatherGrad" cx="30%" cy="30%" r="85%">
        <stop offset="0%" stop-color="#1f3b2e" />
        <stop offset="45%" stop-color="#12241c" />
        <stop offset="80%" stop-color="#0a1510" />
        <stop offset="100%" stop-color="#040806" />
      </radialGradient>

      <!-- Gutter Crease Shadow -->
      <linearGradient id="gutterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="rgba(30,18,10,0)" />
        <stop offset="30%" stop-color="rgba(30,18,10,0.18)" />
        <stop offset="46%" stop-color="rgba(24,14,6,0.58)" />
        <stop offset="50%" stop-color="rgba(16,9,3,0.85)" />
        <stop offset="54%" stop-color="rgba(24,14,6,0.58)" />
        <stop offset="70%" stop-color="rgba(30,18,10,0.18)" />
        <stop offset="100%" stop-color="rgba(30,18,10,0)" />
      </linearGradient>

      <!-- Page Edge Vignette -->
      <linearGradient id="leftVignette" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="rgba(42,28,14,0.30)" />
        <stop offset="6%" stop-color="rgba(42,28,14,0.14)" />
        <stop offset="18%" stop-color="rgba(42,28,14,0.03)" />
        <stop offset="30%" stop-color="rgba(42,28,14,0)" />
      </linearGradient>
      <linearGradient id="rightVignette" x1="100%" y1="0%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="rgba(42,28,14,0.30)" />
        <stop offset="6%" stop-color="rgba(42,28,14,0.14)" />
        <stop offset="18%" stop-color="rgba(42,28,14,0.03)" />
        <stop offset="30%" stop-color="rgba(42,28,14,0)" />
      </linearGradient>

      <!-- Mughal Jaali Pattern -->
      <pattern id="mughalJaali" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 40 20 L 20 40 L 0 20 Z" fill="none" stroke="#D4AF37" stroke-width="0.75" opacity="0.38" />
        <circle cx="20" cy="20" r="3.5" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.4" />
        <path d="M 0 0 L 8 8 M 40 0 L 32 8 M 0 40 L 8 32 M 40 40 L 32 32" stroke="#D4AF37" stroke-width="0.5" opacity="0.25" />
      </pattern>

      <!-- Damask Watermark -->
      <pattern id="damaskParchment" width="60" height="60" patternUnits="userSpaceOnUse">
        <circle cx="30" cy="30" r="1.5" fill="#C5A059" opacity="0.12" />
        <path d="M 30 15 Q 35 25 30 35 Q 25 25 30 15 Z" fill="#C5A059" opacity="0.06" />
        <path d="M 15 30 Q 25 35 35 30 Q 25 25 15 30 Z" fill="#C5A059" opacity="0.06" />
      </pattern>

      <!-- Drop Shadows -->
      <filter id="goldDropShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(40,25,10,0.35)" />
      </filter>
      <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="rgba(25,12,6,0.48)" />
      </filter>
    </defs>
  
  
    <rect width="1760" height="1240" fill="#F9F5EC" />
    <rect width="1760" height="1240" fill="url(#damaskParchment)" />
    <rect width="880" height="1240" fill="#F4EDE0" opacity="0.55" />
    <rect x="880" width="880" height="1240" fill="#F6EFE3" opacity="0.55" />
    <rect width="220" height="1240" fill="url(#leftVignette)" />
    <rect x="1540" width="220" height="1240" fill="url(#rightVignette)" />
    <rect x="790" width="180" height="1240" fill="url(#gutterGrad)" />
  

  <!-- LEFT HALF: Moroccan Emerald Leather Cover Inside Lining -->
  <rect x="0" y="0" width="880" height="1240" fill="url(#leatherGrad)" />
  <rect x="0" y="0" width="880" height="1240" fill="url(#mughalJaali)" opacity="0.6" />

  <!-- Leather Outer Gold Tooling & Real Saddle Stitching -->
  <rect x="44" y="44" width="792" height="1152" fill="none" stroke="url(#gold24k)" stroke-width="3" rx="8" />
  <rect x="54" y="54" width="772" height="1132" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="5,4" opacity="0.8" rx="6" />
  <rect x="66" y="66" width="748" height="1108" fill="none" stroke="url(#gold24k)" stroke-width="0.8" opacity="0.5" rx="4" />

