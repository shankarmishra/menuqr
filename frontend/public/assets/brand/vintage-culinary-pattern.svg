<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. VINTAGE DINING FORK -->
    <g id="cul-fork" stroke="#3A2F27" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0,0 L 0,26 C 0,30 2,33 5,34 L 5,65 C 5,67 3,69 3,71 C 3,73 5,74 5,74 C 5,74 7,73 7,71 C 7,69 5,67 5,65 L 5,34 C 8,33 10,30 10,26 L 10,0" />
      <line x1="3.3" y1="0" x2="3.3" y2="18" />
      <line x1="6.7" y1="0" x2="6.7" y2="18" />
    </g>

    <!-- 2. VINTAGE CURRY SPOON -->
    <g id="cul-spoon" stroke="#3A2F27" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0,16 C 0,7 4,0 9,0 C 14,0 18,7 18,16 C 18,24 14,29 10,31 L 10,65 C 10,67 8,69 8,72 C 8,74 10,75 10,75 C 10,75 12,74 12,72 C 12,69 10,67 10,65 L 10,31 C 6,29 0,24 0,16 Z" />
      <path d="M 4,14 C 4,8 6,4 9,4" stroke-width="0.5" opacity="0.6" />
    </g>

    <!-- 3. WHOLE RED CHILLI (लाल मिर्च) -->
    <g id="cul-chilli" stroke="#3A2F27" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4,0 C 6,3 7,7 6,10 L 4,11" /> <!-- Stem -->
      <path d="M 1,11 C 3,9 7,9 9,11 C 12,16 15,25 12,35 C 9,45 -2,52 -6,56 C -4,50 3,42 4,32 C 5,23 2,16 1,11 Z" fill="#3A2F27" fill-opacity="0.04" />
      <path d="M 4,18 C 7,26 6,34 2,42" stroke-width="0.5" opacity="0.6" />
    </g>

    <!-- 4. GARLIC BULB (लहसुन) -->
    <g id="cul-garlic" stroke="#3A2F27" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 11,0 C 11,3 12,6 13,8 C 19,10 24,16 23,23 C 22,29 17,33 11,33 C 5,33 0,29 -1,23 C -2,16 3,10 9,8 C 10,6 11,3 11,0" fill="#3A2F27" fill-opacity="0.03" />
      <path d="M 9,8 C 7,13 6,21 11,33" stroke-width="0.5" />
      <path d="M 13,8 C 15,13 16,21 11,33" stroke-width="0.5" />
      <path d="M 3,18 C 4,24 7,28 11,32" stroke-width="0.4" opacity="0.6" />
      <path d="M 19,18 C 18,24 15,28 11,32" stroke-width="0.4" opacity="0.6" />
    </g>

    <!-- 5. CITRUS / LEMON WHEEL (नींबू चक्र) -->
    <g id="cul-lemon" stroke="#3A2F27" stroke-width="0.8" fill="none" stroke-linecap="round">
      <circle cx="16" cy="16" r="15" />
      <circle cx="16" cy="16" r="13" stroke-dasharray="2 2" stroke-width="0.5" />
      <circle cx="16" cy="16" r="2.5" fill="#3A2F27" fill-opacity="0.2" />
      <!-- Radiating pulp segments -->
      <path d="M 16,12 C 16,6 14,4 16,3 C 18,4 16,6 16,12 Z" fill="#3A2F27" fill-opacity="0.05" />
      <path d="M 16,20 C 16,26 18,28 16,29 C 14,28 16,26 16,20 Z" fill="#3A2F27" fill-opacity="0.05" />
      <path d="M 12,16 C 6,16 4,14 3,16 C 4,18 6,16 12,16 Z" fill="#3A2F27" fill-opacity="0.05" />
      <path d="M 20,16 C 26,16 28,18 29,16 C 28,14 26,16 20,16 Z" fill="#3A2F27" fill-opacity="0.05" />
      <path d="M 13,13 C 8,8 7,6 9,5 C 10,7 12,9 13,13 Z" fill="#3A2F27" fill-opacity="0.05" />
      <path d="M 19,19 C 24,24 25,26 23,27 C 22,25 20,23 19,19 Z" fill="#3A2F27" fill-opacity="0.05" />
      <path d="M 13,19 C 8,24 7,26 9,27 C 10,25 12,23 13,19 Z" fill="#3A2F27" fill-opacity="0.05" />
      <path d="M 19,13 C 24,8 25,6 23,5 C 22,7 20,9 19,13 Z" fill="#3A2F27" fill-opacity="0.05" />
    </g>

    <!-- 6. STEAMING CLAY HANDI / CURRY POT (हांडी) -->
    <g id="cul-handi" stroke="#3A2F27" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Rim -->
      <ellipse cx="18" cy="8" rx="16" ry="4" />
      <!-- Body -->
      <path d="M 3,9 C 0,16 1,28 10,32 C 14,34 22,34 26,32 C 35,28 36,16 33,9" fill="#3A2F27" fill-opacity="0.04" />
      <!-- Base ring -->
      <path d="M 11,32 C 14,34 22,34 25,32" />
      <!-- Ear handles -->
      <path d="M 2,12 C -2,12 -2,17 2,18" />
      <path d="M 34,12 C 38,12 38,17 34,18" />
      <!-- Steam swirls -->
      <path d="M 13,3 C 12,-2 15,-5 13,-9" stroke-width="0.5" />
      <path d="M 19,2 C 21,-3 18,-6 20,-10" stroke-width="0.5" />
      <path d="M 24,4 C 23,0 26,-3 25,-7" stroke-width="0.5" />
    </g>

    <!-- 7. SAMOSA WITH CRISPY RIDGES (समोसा) -->
    <g id="cul-samosa" stroke="#3A2F27" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 18,2 C 23,12 32,24 34,28 C 30,30 18,32 4,30 C 2,24 10,12 18,2 Z" fill="#3A2F27" fill-opacity="0.04" />
      <!-- Ridge crimping -->
      <path d="M 18,2 C 18,12 18,22 19,30" stroke-width="0.5" />
      <path d="M 5,28 C 12,27 22,27 33,27" stroke-width="0.5" stroke-dasharray="1.5 1.5" />
    </g>

    <!-- 8. FRESH CORIANDER / HERB SPRIG (धनिया पत्ती) -->
    <g id="cul-herb" stroke="#3A2F27" stroke-width="0.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0,28 C 8,24 16,16 22,0" />
      <!-- Leaf 1 -->
      <path d="M 22,0 C 26,1 28,6 26,9 C 23,11 18,8 18,6 Z" fill="#3A2F27" fill-opacity="0.04" />
      <!-- Leaf 2 -->
      <path d="M 16,10 C 13,8 9,10 9,14 C 11,17 15,16 16,14 Z" fill="#3A2F27" fill-opacity="0.04" />
      <!-- Leaf 3 -->
      <path d="M 17,13 C 21,12 24,15 23,18 C 21,21 17,19 16,16 Z" fill="#3A2F27" fill-opacity="0.04" />
      <!-- Leaf 4 -->
      <path d="M 10,21 C 6,19 4,23 5,26 C 8,27 10,25 10,22 Z" fill="#3A2F27" fill-opacity="0.04" />
    </g>

    <!-- 9. SLICED TOMATO (कटा हुआ टमाटर) -->
    <g id="cul-tomato" stroke="#3A2F27" stroke-width="0.8" fill="none" stroke-linecap="round">
      <circle cx="14" cy="14" r="13" />
      <circle cx="14" cy="14" r="11" stroke-width="0.5" stroke-dasharray="2 1.5" />
      <path d="M 9,9 C 7,12 8,16 11,15 C 13,14 12,10 9,9 Z" fill="#3A2F27" fill-opacity="0.05" />
      <path d="M 19,9 C 21,12 20,16 17,15 C 15,14 16,10 19,9 Z" fill="#3A2F27" fill-opacity="0.05" />
      <path d="M 14,19 C 11,21 14,23 17,21 C 18,19 16,18 14,19 Z" fill="#3A2F27" fill-opacity="0.05" />
      <circle cx="10" cy="12" r="0.8" fill="#3A2F27" />
      <circle cx="18" cy="12" r="0.8" fill="#3A2F27" />
      <circle cx="14" cy="20" r="0.8" fill="#3A2F27" />
    </g>

    <!-- 10. CONDIMENT / OLIVE OIL BOTTLE (विंटेज बोतल) -->
    <g id="cul-bottle" stroke="#3A2F27" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="0" width="6" height="5" rx="1" fill="#3A2F27" fill-opacity="0.1" /> <!-- Cork -->
      <path d="M 8,5 L 8,14 C 8,18 3,24 2,30 L 2,52 C 2,55 5,58 10,58 L 10,58 C 15,58 18,55 18,52 L 18,30 C 17,24 12,18 12,14 L 12,5 Z" fill="#3A2F27" fill-opacity="0.03" />
      <rect x="5" y="32" width="10" height="15" rx="1" stroke-width="0.5" stroke-dasharray="1.5 1.5" /> <!-- Label -->
    </g>

    <!-- 11. TANDOORI ROTI / NAAN (तंदूरी नान) -->
    <g id="cul-naan" stroke="#3A2F27" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4,2 C 16,-2 32,4 38,16 C 42,26 36,36 26,40 C 14,42 2,34 0,22 C -1,14 1,6 4,2 Z" fill="#3A2F27" fill-opacity="0.03" />
      <!-- Char blisters -->
      <ellipse cx="14" cy="14" rx="4" ry="2.5" transform="rotate(-15 14 14)" stroke-width="0.5" fill="#3A2F27" fill-opacity="0.06" />
      <ellipse cx="26" cy="18" rx="3.5" ry="2" transform="rotate(25 26 18)" stroke-width="0.5" fill="#3A2F27" fill-opacity="0.06" />
      <ellipse cx="18" cy="28" rx="4.5" ry="2.5" stroke-width="0.5" fill="#3A2F27" fill-opacity="0.06" />
      <circle cx="8" cy="24" r="1.5" stroke-width="0.4" />
      <circle cx="28" cy="30" r="1.2" stroke-width="0.4" />
    </g>

    <!-- 12. CHAI KULHAD / TEA CUP (कुल्हड़) -->
    <g id="cul-kulhad" stroke="#3A2F27" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="4" rx="11" ry="3" />
      <path d="M 1,4 L 4,24 C 5,27 8,28 12,28 C 16,28 19,27 20,24 L 23,4" fill="#3A2F27" fill-opacity="0.04" />
      <ellipse cx="12" cy="26" rx="7" ry="2" stroke-width="0.5" />
      <!-- Steam -->
      <path d="M 8,-1 C 7,-4 10,-7 9,-10" stroke-width="0.5" />
      <path d="M 15,-1 C 17,-4 14,-7 16,-10" stroke-width="0.5" />
    </g>

    <!-- 13. INDIAN SPICES (STAR ANISE & CLOVES - चक्रफूल व लौंग) -->
    <g id="cul-star-anise" stroke="#3A2F27" stroke-width="0.7" fill="#3A2F27" fill-opacity="0.04" stroke-linecap="round" stroke-linejoin="round">
      <!-- 6 radiating pods -->
      <path d="M 12,12 C 12,6 15,2 17,2 C 19,2 17,6 15,12 Z" />
      <path d="M 12,12 C 18,10 22,12 23,14 C 23,16 19,16 14,14 Z" />
      <path d="M 12,12 C 15,17 17,21 16,23 C 14,24 13,20 12,15 Z" />
      <path d="M 12,12 C 8,16 6,20 4,20 C 3,19 6,15 10,13 Z" />
      <path d="M 12,12 C 6,11 2,8 2,6 C 3,5 7,8 11,11 Z" />
      <path d="M 12,12 C 9,7 8,3 10,2 C 11,2 12,6 13,10 Z" />
      <circle cx="12" cy="12" r="2" fill="#3A2F27" fill-opacity="0.3" stroke="none" />
    </g>

    <!-- 14. CHEF KNIFE (रसोई चाकू) -->
    <g id="cul-knife" stroke="#3A2F27" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4,0 C 7,0 8,15 8,40 L 4,40 L 4,0 Z" /> <!-- Handle -->
      <circle cx="6" cy="10" r="0.8" fill="#3A2F27" />
      <circle cx="6" cy="25" r="0.8" fill="#3A2F27" />
      <!-- Blade -->
      <path d="M 4,40 L 2,40 C 2,55 5,72 16,80 L 16,40 L 8,40" fill="#3A2F27" fill-opacity="0.04" />
      <line x1="14" y1="42" x2="14" y2="76" stroke-width="0.4" opacity="0.6" />
    </g>

    <!-- 15. SLICED MUSHROOM (मशरूम) -->
    <g id="cul-mushroom" stroke="#3A2F27" stroke-width="0.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 1,12 C 1,4 8,0 14,0 C 20,0 27,4 27,12 C 23,13 5,13 1,12 Z" fill="#3A2F27" fill-opacity="0.04" />
      <path d="M 10,13 L 9,23 C 9,25 12,26 14,26 C 16,26 19,25 19,23 L 18,13" />
      <path d="M 5,11 C 9,7 19,7 23,11" stroke-width="0.4" opacity="0.5" />
    </g>

    <!-- 16. CROISSANT / BAKERY ROLL (क्रॉसेंट) -->
    <g id="cul-roll" stroke="#3A2F27" stroke-width="0.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4,18 C 0,14 2,7 8,5 C 16,2 26,2 34,5 C 40,7 42,14 38,18 C 34,16 30,8 21,8 C 12,8 8,16 4,18 Z" fill="#3A2F27" fill-opacity="0.04" />
      <path d="M 11,6 C 13,10 14,14 14,17" stroke-width="0.5" />
      <path d="M 21,8 C 21,12 21,16 21,18" stroke-width="0.5" />
      <path d="M 31,6 C 29,10 28,14 28,17" stroke-width="0.5" />
    </g>
  </defs>

  <!-- BACKGROUND CULINARY SKETCH WALLPAPER (400x400 SEAMLESS WRAP) -->
  
  <!-- Row 1 (y: 10 - 70) -->
  <use href="#cul-fork" transform="translate(30, 15) rotate(15)" />
  <use href="#cul-lemon" transform="translate(110, 20) rotate(-10)" />
  <use href="#cul-handi" transform="translate(190, 25)" />
  <use href="#cul-chilli" transform="translate(290, 15) rotate(45)" />
  <use href="#cul-garlic" transform="translate(355, 30)" />

  <!-- Row 2 (y: 85 - 150) -->
  <use href="#cul-samosa" transform="translate(15, 110) rotate(-10)" />
  <use href="#cul-spoon" transform="translate(90, 95) rotate(-25)" />
  <use href="#cul-star-anise" transform="translate(160, 120) rotate(15)" />
  <use href="#cul-tomato" transform="translate(230, 105)" />
  <use href="#cul-bottle" transform="translate(310, 90) rotate(10)" />

  <!-- Row 3 (y: 170 - 240) -->
  <use href="#cul-herb" transform="translate(35, 195) rotate(20)" />
  <use href="#cul-naan" transform="translate(115, 185) rotate(-15)" />
  <use href="#cul-knife" transform="translate(210, 170) rotate(-35)" />
  <use href="#cul-kulhad" transform="translate(285, 205)" />
  <use href="#cul-mushroom" transform="translate(350, 185) rotate(15)" />

  <!-- Row 4 (y: 260 - 330) -->
  <use href="#cul-lemon" transform="translate(20, 280) rotate(35)" />
  <use href="#cul-chilli" transform="translate(85, 275) rotate(-30)" />
  <use href="#cul-roll" transform="translate(170, 285) rotate(10)" />
  <use href="#cul-handi" transform="translate(255, 275) scale(0.9)" />
  <use href="#cul-fork" transform="translate(345, 270) rotate(-20)" />

  <!-- Row 5 (y: 340 - 395) & Tile Borders -->
  <use href="#cul-spoon" transform="translate(45, 335) rotate(30)" />
  <use href="#cul-garlic" transform="translate(130, 350) rotate(-15)" />
  <use href="#cul-samosa" transform="translate(215, 345) rotate(20)" />
  <use href="#cul-tomato" transform="translate(295, 350) rotate(-10)" />
  <use href="#cul-star-anise" transform="translate(365, 340)" />

  <!-- Scattered spice & seasoning accents (seeds, peppercorns, salt flakes) -->
  <circle cx="75" cy="70" r="1.2" fill="#3A2F27" opacity="0.6" />
  <circle cx="170" cy="80" r="1.5" fill="#3A2F27" opacity="0.5" />
  <circle cx="270" cy="65" r="1.2" fill="#3A2F27" opacity="0.6" />
  <circle cx="65" cy="165" r="1.4" fill="#3A2F27" opacity="0.5" />
  <circle cx="185" cy="160" r="1.2" fill="#3A2F27" opacity="0.6" />
  <circle cx="275" cy="165" r="1.5" fill="#3A2F27" opacity="0.5" />
  <circle cx="80" cy="245" r="1.2" fill="#3A2F27" opacity="0.6" />
  <circle cx="150" cy="255" r="1.5" fill="#3A2F27" opacity="0.5" />
  <circle cx="340" cy="240" r="1.2" fill="#3A2F27" opacity="0.6" />
  <circle cx="95" cy="335" r="1.4" fill="#3A2F27" opacity="0.5" />
  <circle cx="190" cy="335" r="1.2" fill="#3A2F27" opacity="0.6" />
</svg>