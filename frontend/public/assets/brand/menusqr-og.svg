<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#FAFAF7"/>
  <!-- Pattern -->
  <g opacity="0.03" fill="#151C19">
    <rect x="0" y="0" width="1200" height="630" fill="url(#pattern)" />
  </g>
  <!-- Mark -->
  <g transform="translate(480, 180) scale(3.5)">
    <!-- Top Left -->
    <rect x="8" y="8" width="18" height="6" rx="2" fill="#151C19" />
    <rect x="8" y="8" width="6" height="22" rx="2" fill="#151C19" />
    <!-- Top Right -->
    <rect x="38" y="8" width="18" height="6" rx="2" fill="#151C19" />
    <rect x="50" y="8" width="6" height="22" rx="2" fill="#151C19" />
    <!-- Bottom Left -->
    <rect x="8" y="50" width="18" height="6" rx="2" fill="#151C19" />
    <rect x="8" y="34" width="6" height="22" rx="2" fill="#151C19" />
    <!-- Bottom Right -->
    <rect x="38" y="50" width="18" height="6" rx="2" fill="#151C19" />
    <rect x="50" y="34" width="6" height="22" rx="2" fill="#151C19" />
    <!-- Orange Accent -->
    <rect x="28" y="24" width="8" height="8" rx="2" fill="#E8783C" />
  </g>
  <!-- Text -->
  <text x="600" y="460" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" text-anchor="middle" letter-spacing="-2">
    <tspan fill="#151C19">Menus</tspan>
    <tspan fill="#E8783C">QR</tspan>
  </text>
  <text x="600" y="520" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="700" font-size="18" fill="#151C19" opacity="0.6" text-anchor="middle" letter-spacing="4">
    PRINT ONCE. UPDATE ANYTIME.
  </text>
  <defs>
    <pattern id="pattern" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect x="20" y="20" width="18" height="6" rx="2" />
      <rect x="20" y="20" width="6" height="22" rx="2" />
      <rect x="120" y="120" width="18" height="6" rx="2" />
      <rect x="132" y="104" width="6" height="22" rx="2" />
      <circle cx="80" cy="80" r="40" stroke="#151C19" stroke-width="2" fill="none" stroke-dasharray="4 4" />
    </pattern>
  </defs>
</svg>
