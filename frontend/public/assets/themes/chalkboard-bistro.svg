<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="1200" height="1700">
            <defs>
                
            <linearGradient id="chalkboardBlack" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#1c1f20"/>
                <stop offset="50%" stop-color="#242829"/>
                <stop offset="100%" stop-color="#141617"/>
            </linearGradient>
        
            </defs>
            
            <rect width="1200" height="1700" fill="url(#chalkboardBlack)"/>

            <!-- Chalk Frame & Flourishes -->
            <rect x="40" y="40" width="1120" height="1620" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="15,10" opacity="0.35"/>

            <!-- Center Dusty Chalk Slate -->
            <rect x="85" y="85" width="1030" height="1530" rx="12" fill="#181B1C" fill-opacity="0.95" stroke="#FEF08A" stroke-width="1.6" stroke-opacity="0.4"/>
            <rect x="100" y="100" width="1000" height="1500" rx="8" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="8,4" stroke-opacity="0.25"/>
        
        </svg>