<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="1200" height="1700">
            <defs>
                
            <linearGradient id="plumVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#240720"/>
                <stop offset="50%" stop-color="#170314"/>
                <stop offset="100%" stop-color="#0d010b"/>
            </linearGradient>
            <linearGradient id="silverWark" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#CBD5E1"/>
                <stop offset="50%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#94A3B8"/>
            </linearGradient>
        
            </defs>
            
            <rect width="1200" height="1700" fill="url(#plumVelvet)"/>

            <!-- Center Royal Velvet Card with Silver Wark Border -->
            <rect x="85" y="85" width="1030" height="1530" rx="14" fill="#1E071A" fill-opacity="0.95" stroke="url(#silverWark)" stroke-width="1.8"/>
            <rect x="100" y="100" width="1000" height="1500" rx="10" fill="none" stroke="#FBBF24" stroke-width="1" stroke-dasharray="8,4" stroke-opacity="0.3"/>
        
        </svg>