<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="1200" height="1700">
            <defs>
                
            <pattern id="dinerCheck" width="40" height="40" patternUnits="userSpaceOnUse">
                <rect width="40" height="40" fill="#fff"/>
                <rect width="20" height="20" fill="#dc2626"/>
                <rect x="20" y="20" width="20" height="20" fill="#dc2626"/>
            </pattern>
        
            </defs>
            
            <rect width="1200" height="1700" fill="#FAFAF9"/>
            <rect width="1200" height="60" fill="url(#dinerCheck)"/>
            <rect y="1640" width="1200" height="60" fill="url(#dinerCheck)"/>

            <!-- Center Wax Deli Card -->
            <rect x="85" y="90" width="1030" height="1520" rx="12" fill="#FFFFFF" fill-opacity="0.97" stroke="#DC2626" stroke-width="2" stroke-opacity="0.4"/>
            <rect x="100" y="105" width="1000" height="1490" rx="8" fill="none" stroke="#B45309" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.3"/>
        
        </svg>