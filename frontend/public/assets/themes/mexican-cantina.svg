<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="1200" height="1700">
            <defs>
                
            <linearGradient id="terracottaBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFF6EC"/>
                <stop offset="50%" stop-color="#FCE4CF"/>
                <stop offset="100%" stop-color="#F3CBB0"/>
            </linearGradient>
        
            </defs>
            
            <rect width="1200" height="1700" fill="url(#terracottaBg)"/>

            <!-- Talavera Tile Diamond Corner Motifs -->
            <g transform="translate(60, 60)" stroke="#0284C7" stroke-width="2" fill="#F97316" fill-opacity="0.3">
                <polygon points="30,0 60,30 30,60 0,30"/>
            </g>
            <g transform="translate(1080, 60)" stroke="#0284C7" stroke-width="2" fill="#F97316" fill-opacity="0.3">
                <polygon points="30,0 60,30 30,60 0,30"/>
            </g>

            <!-- Center Sun-Baked Card -->
            <rect x="85" y="85" width="1030" height="1530" rx="14" fill="#FFFDF8" fill-opacity="0.96" stroke="#C2410C" stroke-width="1.8" stroke-opacity="0.35"/>
            <rect x="100" y="100" width="1000" height="1500" rx="10" fill="none" stroke="#0284C7" stroke-width="1" stroke-dasharray="8,5" stroke-opacity="0.25"/>
        
        </svg>