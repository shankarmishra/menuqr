<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="1200" height="1700">
            <defs>
                
            <linearGradient id="flourMarble" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FCFAF7"/>
                <stop offset="50%" stop-color="#F5EEE6"/>
                <stop offset="100%" stop-color="#EDE2D5"/>
            </linearGradient>
        
            </defs>
            
            <rect width="1200" height="1700" fill="url(#flourMarble)"/>
            
            <!-- Wheat Sheaves & Rolling Pin Corner Graphics -->
            <g transform="translate(50, 40)" stroke="#B47C57" stroke-width="1.5" fill="none" opacity="0.4">
                <path d="M10 100 Q40 60 80 10"/>
                <ellipse cx="70" cy="20" rx="8" ry="4" transform="rotate(-30 70 20)" fill="#D4AE68" fill-opacity="0.3"/>
                <ellipse cx="55" cy="35" rx="8" ry="4" transform="rotate(-30 55 35)" fill="#D4AE68" fill-opacity="0.3"/>
                <ellipse cx="40" cy="55" rx="8" ry="4" transform="rotate(-30 40 55)" fill="#D4AE68" fill-opacity="0.3"/>
            </g>
            <g transform="translate(1070, 1560)" stroke="#B47C57" stroke-width="1.5" fill="none" opacity="0.4">
                <path d="M70 10 Q40 50 0 100"/>
                <ellipse cx="10" cy="90" rx="8" ry="4" transform="rotate(30 10 90)" fill="#D4AE68" fill-opacity="0.3"/>
                <ellipse cx="25" cy="75" rx="8" ry="4" transform="rotate(30 25 75)" fill="#D4AE68" fill-opacity="0.3"/>
            </g>

            <!-- Center Linen Card -->
            <rect x="85" y="85" width="1030" height="1530" rx="12" fill="#FFFFFF" fill-opacity="0.96" stroke="#8C5A3E" stroke-width="1.2" stroke-opacity="0.35"/>
            <rect x="98" y="98" width="1004" height="1504" rx="8" fill="none" stroke="#B47C57" stroke-width="0.8" stroke-dasharray="6,4" stroke-opacity="0.3"/>
        
        </svg>