<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="1200" height="1700">
            <defs>
                
            <linearGradient id="kraftBurlap" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#EFE4D2"/>
                <stop offset="50%" stop-color="#E2D2BC"/>
                <stop offset="100%" stop-color="#D5BF9E"/>
            </linearGradient>
        
            </defs>
            
            <rect width="1200" height="1700" fill="url(#kraftBurlap)"/>

            <!-- Coffee Cup Crema Ring Watermark -->
            <circle cx="1050" cy="220" r="110" fill="none" stroke="#6F4E37" stroke-width="8" opacity="0.12"/>
            <circle cx="1060" cy="215" r="95" fill="none" stroke="#6F4E37" stroke-width="3" opacity="0.08"/>

            <!-- Coffee Beans on Corners -->
            <g fill="#4A2E1B" opacity="0.45">
                <ellipse cx="70" cy="80" rx="14" ry="9" transform="rotate(25 70 80)"/>
                <ellipse cx="105" cy="65" rx="13" ry="8" transform="rotate(-40 105 65)"/>
                <ellipse cx="80" cy="115" rx="12" ry="7" transform="rotate(70 80 115)"/>
                <ellipse cx="1120" cy="1620" rx="14" ry="9" transform="rotate(15 1120 1620)"/>
                <ellipse cx="1080" cy="1635" rx="13" ry="8" transform="rotate(-30 1080 1635)"/>
            </g>

            <!-- Center Kraft Card -->
            <rect x="90" y="90" width="1020" height="1520" rx="14" fill="#FBF7F0" fill-opacity="0.94" stroke="#6F4E37" stroke-width="1.8" stroke-opacity="0.4"/>
            <rect x="105" y="105" width="990" height="1490" rx="10" fill="none" stroke="#8B4513" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.25"/>
        
        </svg>