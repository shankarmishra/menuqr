            <line x1="60" y1="1650" x2="1140" y2="1650" stroke="#1E3A8A" stroke-width="3" opacity="0.35"/>

            <!-- Center White Stucco Card -->
            <rect x="85" y="85" width="1030" height="1530" rx="12" fill="#FFFFFF" fill-opacity="0.97" stroke="#1E3A8A" stroke-width="1.6" stroke-opacity="0.3"/>
            <rect x="100" y="100" width="1000" height="1500" rx="8" fill="none" stroke="#3B82F6" stroke-width="0.8" stroke-dasharray="8,4" stroke-opacity="0.25"/>
        
        </svg>