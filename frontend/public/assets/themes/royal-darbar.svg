<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="1200" height="1700">
            <defs>
                
            <linearGradient id="darbarVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2a0818"/>
                <stop offset="50%" stop-color="#19040e"/>
                <stop offset="100%" stop-color="#100208"/>
            </linearGradient>
            <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#C59B27"/>
                <stop offset="50%" stop-color="#FDF0CD"/>
                <stop offset="100%" stop-color="#D4AF37"/>
            </linearGradient>
        
            </defs>
            
            <rect width="1200" height="1700" fill="url(#darbarVelvet)"/>

            <!-- Ornate Mughal Arch Outlines in Background -->
            <path d="M100 1600 L100 450 Q600 50 1100 450 L1100 1600 Z" fill="none" stroke="url(#goldFoil)" stroke-width="2" opacity="0.25"/>
            <path d="M120 1590 L120 460 Q600 80 1080 460 L1080 1590 Z" fill="none" stroke="url(#goldFoil)" stroke-width="1" stroke-dasharray="4,6" opacity="0.3"/>

            <!-- Saffron Flowers & Star Anise Corner Accents -->
            <g transform="translate(60, 60)" stroke="url(#goldFoil)" stroke-width="1.5" fill="none" opacity="0.5">
                <circle cx="40" cy="40" r="25"/>
                <path d="M40 10 L40 70 M10 40 L70 40 M20 20 L60 60 M20 60 L60 20"/>
            </g>
            <g transform="translate(1040, 60)" stroke="url(#goldFoil)" stroke-width="1.5" fill="none" opacity="0.5">
                <circle cx="40" cy="40" r="25"/>
                <path d="M40 10 L40 70 M10 40 L70 40 M20 20 L60 60 M20 60 L60 20"/>
            </g>

            <!-- Center Royal Velvet Card -->
            <rect x="90" y="95" width="1020" height="1510" rx="14" fill="#200613" fill-opacity="0.94" stroke="url(#goldFoil)" stroke-width="1.8"/>
            <rect x="105" y="110" width="990" height="1480" rx="10" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3"/>
            
            <!-- Filigree Corner Brackets -->
            <path d="M110 160 L110 115 L155 115" stroke="url(#goldFoil)" stroke-width="3" fill="none"/>
            <path d="M1090 160 L1090 115 L1045 115" stroke="url(#goldFoil)" stroke-width="3" fill="none"/>
            <path d="M110 1540 L110 1585 L155 1585" stroke="url(#goldFoil)" stroke-width="3" fill="none"/>
            <path d="M1090 1540 L1090 1585 L1045 1585" stroke="url(#goldFoil)" stroke-width="3" fill="none"/>
        
        </svg>