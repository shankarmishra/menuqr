<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="1200" height="1700">
            <defs>
                
            <linearGradient id="tuscanPlaster" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F5EFE6"/>
                <stop offset="50%" stop-color="#EFE6D8"/>
                <stop offset="100%" stop-color="#E5DAC8"/>
            </linearGradient>
            <pattern id="ginghamRed" width="30" height="30" patternUnits="userSpaceOnUse">
                <rect width="30" height="30" fill="#fff"/>
                <rect width="15" height="15" fill="#c23b38" fill-opacity="0.8"/>
                <rect x="15" y="15" width="15" height="15" fill="#c23b38" fill-opacity="0.8"/>
                <rect x="15" width="15" height="15" fill="#992320" fill-opacity="0.5"/>
                <rect y="15" width="15" height="15" fill="#992320" fill-opacity="0.5"/>
            </pattern>
        
            </defs>
            
            <!-- Base Tuscan Limestone -->
            <rect width="1200" height="1700" fill="url(#tuscanPlaster)"/>

            <!-- Perimeter Gingham Red Checker Ribbon (Top & Bottom) -->
            <rect x="0" y="0" width="1200" height="45" fill="url(#ginghamRed)"/>
            <rect x="0" y="1655" width="1200" height="45" fill="url(#ginghamRed)"/>
            <line x1="0" y1="46" x2="1200" y2="46" stroke="#992320" stroke-width="2"/>
            <line x1="0" y1="1654" x2="1200" y2="1654" stroke="#992320" stroke-width="2"/>

            <!-- Basil Leaves & Tomato Corner Accents -->
            <g transform="translate(60, 60)" fill="#2d6a4f" opacity="0.8">
                <path d="M0 30 C15 0, 45 0, 60 20 C45 40, 15 45, 0 30 Z"/>
                <path d="M25 40 C45 25, 75 35, 80 60 C55 65, 35 55, 25 40 Z" fill="#1b4332"/>
                <circle cx="70" cy="20" r="14" fill="#c92a2a"/>
            </g>
            <g transform="translate(1080, 1580)" fill="#2d6a4f" opacity="0.8">
                <path d="M0 30 C15 0, 45 0, 60 20 C45 40, 15 45, 0 30 Z"/>
                <circle cx="10" cy="15" r="14" fill="#c92a2a"/>
            </g>

            <!-- Center Parchment Safe Card -->
            <rect x="90" y="90" width="1020" height="1520" rx="10" fill="#FCFAF6" stroke="#c23b38" stroke-width="1.5" stroke-opacity="0.35"/>
            <rect x="105" y="105" width="990" height="1490" rx="8" fill="none" stroke="#2d6a4f" stroke-width="1" stroke-dasharray="8,4" stroke-opacity="0.3"/>
            
            <!-- Ornate Corner Motifs -->
            <path d="M115 125 L135 125 M125 115 L125 135" stroke="#c23b38" stroke-width="2"/>
            <path d="M1085 125 L1065 125 M1075 115 L1075 135" stroke="#c23b38" stroke-width="2"/>
            <path d="M115 1575 L135 1575 M125 1565 L125 1585" stroke="#c23b38" stroke-width="2"/>
            <path d="M1085 1575 L1065 1575 M1075 1565 L1075 1585" stroke="#c23b38" stroke-width="2"/>
        
        </svg>