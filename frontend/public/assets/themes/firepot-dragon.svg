<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="1200" height="1700">
            <defs>
                
            <linearGradient id="charcoalFlame" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#1c0c0c"/>
                <stop offset="50%" stop-color="#140707"/>
                <stop offset="100%" stop-color="#0a0303"/>
            </linearGradient>
            <radialGradient id="dragonGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ff3300" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#ff3300" stop-opacity="0"/>
            </radialGradient>
        
            </defs>
            
            <rect width="1200" height="1700" fill="url(#charcoalFlame)"/>
            <circle cx="150" cy="150" r="240" fill="url(#dragonGlow)"/>
            <circle cx="1050" cy="1550" r="260" fill="url(#dragonGlow)"/>

            <!-- Center Coal Slate Card -->
            <rect x="85" y="85" width="1030" height="1530" rx="14" fill="#140A0A" fill-opacity="0.95" stroke="#FF4D4D" stroke-width="1.8" stroke-opacity="0.4"/>
            <rect x="100" y="100" width="1000" height="1500" rx="10" fill="none" stroke="#FFAA33" stroke-width="1" stroke-dasharray="8,4" stroke-opacity="0.25"/>
        
        </svg>