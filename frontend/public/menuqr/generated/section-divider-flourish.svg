      <stop stop-color="#FAB700" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#FAB700" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#CE182C"/>
    </linearGradient>
    <linearGradient id="goldGradRight" x1="360" y1="20" x2="580" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CE182C"/>
      <stop offset="0.3" stop-color="#FAB700" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FAB700" stop-opacity="0"/>
    </linearGradient>
  </defs>
